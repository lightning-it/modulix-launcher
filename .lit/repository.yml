---
schema_version: 1
managed_by: lightning-it/shared-assets
repository: modulix-launcher
visibility: public
repository_type: container_image
release_type: semantic_release
artifact_type: container_image
test_profiles:
  - pre-commit
  - container-build
  - container-smoke
  - trivy
  - rpm-srpm
os_matrix:
  - ubuntu-latest
product_matrix: &id001
  - ubi9
  - podman
  - rpm
publishing_targets:
  - github-release
  - quay.io
galaxy_publish: false
quay_publish: true
release_evidence: true
heavy_incus_required: false
readme_badges:
  - pre-commit
  - container-build
  - trivy
  - quay
  - license
workflows:
  release: container-build-publish.yml
  ci: repository-quality.yml
  trivy: container-trivy.yml
image_name: quay.io/l-it/modulix-launcher
registry: quay.io
quay_organization: l-it
quay_repository: modulix-launcher
version_source: semantic-release
supported_base_images: *id001
supported_target_platforms:
  - linux/amd64
  - linux/arm64
smoke_test_command: repository default container smoke test
healthcheck_expectation: container starts successfully where configured
trivy_policy: CRITICAL gate with unfixed vulnerabilities ignored
required_secrets:
  - QUAY_USERNAME
  - QUAY_PASSWORD
containerfile: Containerfile
container_build_context: .
trivy_required: true
trivy_release_gate: true
