# yamllint disable rule:truthy
---
name: Container Build & Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Optional image tag override
        required: false
        default: ""
      push:
        description: Push image to Quay.io
        required: false
        type: boolean
        default: false
  pull_request:
    paths:
      - "Containerfile"
      - ".dockerignore"
      - "packaging/container/**"
      - "packaging/rpm/**"
      - "modulix-launcher"
      - ".github/workflows/container-build-publish.yml"

permissions:
  contents: write
  security-events: write

jobs:
  build:
    name: Build container image
    runs-on: ubuntu-latest
    env:
      REGISTRY: quay.io

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Compute image name + tags
        shell: bash
        env:
          QUAY_NAMESPACE: ${{ vars.QUAY_NAMESPACE }}
        run: |
          set -euo pipefail

          repo="${GITHUB_REPOSITORY#*/}"
          image_repo="${repo#container-}"
          namespace="${QUAY_NAMESPACE:-${GITHUB_REPOSITORY_OWNER}}"
          image_name="${REGISTRY}/${namespace}/${image_repo}"

          push="false"
          tag=""

          if [[ "${GITHUB_EVENT_NAME}" == "release" ]]; then
            push="true"
            tag="${{ github.event.release.tag_name }}"
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            push="${{ github.event.inputs.push || 'false' }}"
            tag="${{ github.event.inputs.tag || '' }}"
            if [[ -z "${tag}" ]]; then
              tag="manual-${GITHUB_SHA::12}"
            fi
          else
            pr_number="${{ github.event.pull_request.number }}"
            tag="pr-${pr_number}-${GITHUB_SHA::12}"
          fi

          case "${push}" in
            true|false) ;;
            *) echo "Invalid push value: ${push}" >&2; exit 1 ;;
          esac

          {
            echo "IMAGE_NAME=${image_name}"
            echo "IMAGE_TAG=${tag}"
            echo "PUSH_IMAGE=${push}"
            echo "IMAGE_TAGS<<EOF"
            echo "${image_name}:${tag}"
            if [[ "${push}" == "true" ]]; then
              echo "${image_name}:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_ENV"

          echo "Using image ${image_name}:${tag} (push=${push})"

      - name: Validate Quay variables/secrets
        if: env.PUSH_IMAGE == 'true'
        shell: bash
        env:
          QUAY_NAMESPACE: ${{ vars.QUAY_NAMESPACE }}
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
        run: |
          set -euo pipefail

          fail=0

          if [ -z "${QUAY_NAMESPACE:-}" ]; then
            echo "::error::Missing required variable: vars.QUAY_NAMESPACE"
            fail=1
          fi

          if [ -z "${QUAY_USERNAME:-}" ]; then
            echo "::error::Missing required secret: secrets.QUAY_USERNAME"
            fail=1
          fi

          if [ -z "${QUAY_PASSWORD:-}" ]; then
            echo "::error::Missing required secret: secrets.QUAY_PASSWORD"
            fail=1
          fi

          if [ "$fail" -ne 0 ]; then
            exit 1
          fi

          echo "Quay configuration present (namespace + credentials)."

      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build local image for Trivy release gate
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Containerfile
          push: false
          load: true
          platforms: linux/amd64
          tags: ${{ env.IMAGE_NAME }}:trivy-${{ github.sha }}

      - name: Generate Trivy release gate SARIF
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:trivy-${{ github.sha }}
          format: sarif
          output: trivy-release-gate.sarif
          vuln-type: os,library
          ignore-unfixed: true
          severity: CRITICAL
          exit-code: "0"

      - name: Upload Trivy release gate SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-release-gate.sarif

      - name: Run Trivy release gate before Quay publish
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:trivy-${{ github.sha }}
          format: table
          vuln-type: os,library
          ignore-unfixed: true
          severity: CRITICAL
          exit-code: "1"

      - name: Log in to Quay.io
        if: env.PUSH_IMAGE == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Build and optionally push image
        id: build_image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Containerfile
          push: ${{ env.PUSH_IMAGE == 'true' }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.IMAGE_TAGS }}

      - name: Generate release evidence
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.build_image.outputs.digest }}
        run: |
          set -euo pipefail
          tags="$(tr '\n' ',' <<<"$IMAGE_TAGS" | sed 's/,$//')"
          published=""
          if [[ "$PUSH_IMAGE" == "true" ]]; then
            published="$tags"
          fi
          TESTED_MATRIX="ubuntu-latest,docker-buildx,container-build" \
          PASSED_JOBS="Build container image" \
          BUILT_ARTIFACTS="${IMAGE_NAME}@${IMAGE_DIGEST:-local-build}" \
          PUBLISHED_ARTIFACTS="$published" \
          CONTAINER_IMAGE_TAGS="$tags" \
          QUAY_IMAGE="${IMAGE_NAME}@${IMAGE_DIGEST:-not-pushed}" \
          RELEASE_TAG="$IMAGE_TAG" \
          RELEASE_VERSION="${IMAGE_TAG#v}" \
          SECURITY_SCAN_RESULT="trivy-completed" \
          TRIVY_STATUS="passed" \
          TRIVY_RELEASE_GATE="passed-before-quay-publish" \
          TRIVY_SEVERITY="CRITICAL" \
          TRIVY_REPORT="trivy-release-gate.sarif" \
          python3 scripts/generate-release-evidence.py

      - name: Attach release evidence
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            dist/release-evidence.json \
            dist/release-evidence.md \
            --clobber

      - name: Upload release evidence artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: release-evidence
          path: |
            dist/release-evidence.json
            dist/release-evidence.md
          if-no-files-found: ignore
